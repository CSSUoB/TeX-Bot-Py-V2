default_install_hook_types: [pre-commit, commit-msg]
default_language_version:
    python: python3.13
default_stages: [pre-commit, pre-merge-commit, manual]

repos:
    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.12.13
      hooks:
        - id: uv-lock
          always_run: true

    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.30.1
      hooks:
        - id: gitleaks

    - repo: https://github.com/codespell-project/codespell
      rev: v2.4.3
      hooks:
        - id: codespell

    - repo: https://github.com/tombi-toml/tombi-pre-commit
      rev: v1.5.5
      hooks:
        - exclude: \A.+\.lock\Z
          id: tombi-format
        - id: tombi-lint

    - repo: https://github.com/tsvikas/sync-with-uv
      rev: v0.6.0
      hooks:
        - id: sync-with-uv

    - repo: https://github.com/kjanat/actionlint
      rev: v1.17.0
      hooks:
        - id: actionlint-shellcheck
          args: [-pyflakes=]

    - repo: https://github.com/zizmorcore/zizmor-pre-commit
      rev: v1.30.1
      hooks:
        - id: zizmor
          args: [--no-progress, --fix, --persona=auditor]

    - repo: https://github.com/dotenv-linter/dotenv-linter
      rev: v4.0.0
      hooks:
        - id: dotenv-linter
          args: [fix, --no-backup]

    - repo: https://github.com/hadolint/hadolint
      rev: v2.15.1
      hooks:
        - id: hadolint-docker

    - repo: https://github.com/adrienverge/yamllint.git
      rev: v1.38.0
      hooks:
        - id: yamllint
          args: [--strict]

    - repo: https://github.com/renovatebot/pre-commit-hooks
      rev: 44.90.1
      hooks:
        - id: renovate-config-validator
          args: [--strict]
          stages: [manual]

    - repo: https://github.com/python-jsonschema/check-jsonschema
      rev: 0.38.0
      hooks:
        - id: check-jsonschema
          args: [--schemafile, 'https://json.schemastore.org/yamllint.json']  # yamllint disable-line rule:quoted-strings
          files: ^\.yamllint\.yaml$  # yamllint disable-line rule:key-ordering
          name: Check yamllint configuration file
          types: [yaml]

    - repo: https://github.com/jorisroovers/gitlint
      rev: v0.19.1
      hooks:
        - id: gitlint
        - id: gitlint-ci

    - repo: builtin
      hooks:
        - id: check-case-conflict
        - id: destroyed-symlinks
        - id: check-vcs-permalinks
        - id: check-added-large-files
        - id: check-illegal-windows-names
        - id: check-shebang-scripts-are-executable
        - id: trailing-whitespace
        - id: check-executables-have-shebangs
        - id: check-json
        - id: check-jsonc
        - id: check-toml
        - id: check-yaml
        - id: end-of-file-fixer
        - id: check-xml
        - id: check-symlinks
        - id: check-merge-conflict
        - id: mixed-line-ending
          args: [--fix=lf]
        - id: detect-private-key
        - id: fix-byte-order-marker

    - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
      rev: v2.16.0
      hooks:
        - id: pretty-format-ini
          args: [--autofix]

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.4
      hooks:
        - id: ruff-check
          args: [--fix]
        - id: ruff-format

    - repo: https://github.com/google/yamlfmt
      rev: v0.21.0
      hooks:
        - entry: yamlfmt
          id: yamlfmt
          pass_filenames: true
          types: [yaml]
