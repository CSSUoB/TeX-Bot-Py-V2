---
# An example TeX-Bot deployment configuration file.
#
# Copy this file to `tex-bot-deployment.yaml` and fill in the required values.
# (Set the `TEX_BOT_CONFIG_PATH` environment variable to keep it somewhere else.)
#
# Comments you add to your own file are preserved when TeX-Bot rewrites it,
# so it is safe to annotate your configuration and still use the `/config` command.
#
# Durations are written largest-unit-first, in the format
# `<days>d<hours>h<minutes>m<seconds>s`, so `1h30m` and `2d` are both valid.

discord:
  # REQUIRED. From your bot's page within the Discord developer portal:
  # <https://discord.com/developers/applications>
  bot-token: ""
  # REQUIRED. The ID of your community group's main Discord guild.
  main-guild-id: 0

community-group:
  # Optional. Falls back to the name of your Discord guild.
  full-name: ""
  # Optional. Falls back to being derived from the full name.
  short-name: ""
  # Optional. Roles that should only be held by members of your community group.
  membership-dependent-roles: []

  links:
    purchase-membership: ""
    membership-perks: ""
    moderation-policy: ""
    # Optional. Used in place of an invite link generated by TeX-Bot.
    custom-discord-invite-link: ""

  msl:
    organisation-id: ""
    # Your members-list authentication session cookie. On the UoB Guild of
    # Students website this is the cookie named `.ASPXAUTH`.
    auth-cookie: ""
    auto-cookie-checking:
      enabled: false
      interval: 10m

# Every section below is optional; the values shown are the defaults.

logging:
  console:
    log-level: INFO
  # Omit this section entirely to disable Discord log-channel logging.
  # discord-channel:
  #   webhook-url: https://discord.com/api/webhooks/...
  #   log-level: WARNING
  discord-api:
    enabled: false
    log-level: INFO
    file-name: discord.log

commands:
  ping:
    easter-egg-probability: 0.01
  stats:
    lookback-days: 30
    displayed-roles:
      - Committee
      - Member
      - Guest
  strike:
    performed-manually-warning-location: DM
    timeout-duration: 1d
    reported-message-destination-channel: discord

reminders:
  send-introduction-reminders:
    # One of `once`, `interval` or `false`.
    enabled: once
    delay: 1d16h
    interval: 6h
  send-get-roles-reminders:
    enabled: true
    delay: 1d16h
    interval: 6h

auto-add-committee-to-threads: true
