# An example TeX-Bot deployment configuration file.
#
# Copy this file to `tex-bot-deployment.yaml` and fill in the required values.
# (Set the `TEX_BOT_CONFIG_PATH` environment variable to keep it somewhere else.)
#
# Comments you add to your own file are preserved when TeX-Bot rewrites it,
# so it is safe to annotate your configuration and still use the `/config` command.
#
# Durations are written largest-unit-first, in the format
# `<days>d<hours>h<minutes>m<seconds>s`, so `1h30m` and `2d` are both valid.
# Every part must carry its unit, so a bare `24` is rejected rather than being read as
# 24 seconds. The `interval` of a recurring task must be longer than zero, because a
# task set to repeat every `0s` would run continuously without ever pausing; the same
# applies to the strike `timeout-duration`, because a `0s` timeout would apply no
# moderation action at all.
#
# Run `/config reload` after editing this file to apply your changes.
#
# Individual settings can also be changed from within Discord, without editing this file
# by hand: `/config get` shows what a setting is currently set to, `/config set` changes
# one, and `/config unset` returns one to its default. Each of them is committee-only,
# and writes back to this file while keeping the comments you have added to it.
#
# If you edit this file by hand, run `/config reload` before using `/config set` or
# `/config unset`. Both refuse to run against a file that has been edited since TeX-Bot
# last loaded it, so that a change made from within Discord is never quietly mixed
# together with one made here.
# Most settings take effect straight away, because they are read at the moment they
# are used. A few cannot, and `/config reload` will tell you when a restart is needed:
#
#   * `discord:bot-token` & `discord:main-guild-id` are used to connect to Discord and
#     to look up your guild's roles & channels while TeX-Bot is starting up.
#   * The `enabled` & `interval` of any recurring task (the reminders below, and MSL
#     auto-cookie-checking) are fixed when that task is created at start-up. Their
#     `delay` settings are *not*, and do take effect immediately.
#
# A reload never applies a configuration that fails validation: if this file contains a
# mistake, TeX-Bot keeps running on the last configuration that loaded successfully and
# reports the line responsible.

discord:
    # REQUIRED. From your bot's page within the Discord developer portal:
    # <https://discord.com/developers/applications>
    bot-token: ""
    # REQUIRED. The ID of your community group's main Discord guild.
    main-guild-id: 0

# Everything below is optional, & may be left out entirely. Each value shown is the
# default that TeX-Bot uses when the setting is not written here at all.
#
# An empty value is not the same as an absent one: every setting that is present must
# hold a valid value, so leave a setting out entirely rather than setting it to "".

community-group:
    # Falls back to the name of your Discord guild.
    # full-name: Computer Science Society
    # Falls back to being derived from the full name.
    # short-name: CSS
    # Roles that should only be held by members of your community group.
    membership-dependent-roles: []

    # Uncomment only the links you have; each one is used solely by the messages that
    # mention it, which leave it out when it is unset.
    # links:
    #   purchase-membership: https://example.com/join
    #   membership-perks: https://example.com/perks
    #   moderation-policy: https://example.com/moderation-policy
    #   # Used in place of an invite link generated by TeX-Bot.
    #   custom-discord-invite-link: https://discord.gg/example

    msl:
        # Your community group's organisation ID on your MSL website.
        # organisation-id: "1234"
        # Your members-list authentication session cookie, extracted from your
        # web-browser after logging in. It is probably named `.AspNet.SharedCookie`.
        # auth-cookie: your-authentication-cookie-value
        auto-cookie-checking:
            enabled: false
            interval: 10m

logging:
    console:
        log-level: INFO
    # Omit this section entirely to disable Discord log-channel logging.
    # discord-channel:
    #   webhook-url: https://discord.com/api/webhooks/...
    #   log-level: WARNING
    discord-api:
        enabled: false
        log-level: INFO
        file-name: discord.log

commands:
    ping:
        easter-egg-probability: 0.01
    stats:
        lookback-days: 30
        displayed-roles:
            - Committee
            - Committee-Elect
            - Student Rep
            - Member
            - Guest
            - Server Booster
            - Foundation Year
            - First Year
            - Second Year
            - Final Year
            - Year In Industry
            - Year Abroad
            - PGT
            - PGR
            - Alumnus/Alumna
            - Postdoc
            - Quiz Victor
    strike:
        performed-manually-warning-location: DM
        # How long a first strike times a member out for.
        # Discord will not apply a timeout longer than 28 days.
        timeout-duration: 1d
        reported-message-destination-channel: discord

reminders:
    send-introduction-reminders:
        # One of `once`, `interval` or `false`.
        enabled: once
        delay: 1d16h
        interval: 6h
    send-get-roles-reminders:
        enabled: true
        delay: 1d16h
        interval: 6h

auto-add-committee-to-threads: true
